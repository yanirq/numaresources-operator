apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/yanirq/numaresources-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch
      == "konflux"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: numaresources-operator-4-19
    appstudio.openshift.io/component: numaresources-operator-4-19
    pipelines.appstudio.openshift.io/type: build
  name: numaresources-operator-4-19-on-push
  namespace: yquinn-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/yquinn-tenant/numaresources-operator-4-19:{{revision}}
  - name: build-platforms
    value:
    - linux/x86_64
  - name: dockerfile
    value: /.konflux/operator/konflux.Dockerfile
  - name: hermetic
    value: "true"
  - name: dev-package-managers
    value: "true"    
  - name: prefetch-input
    value: '[{"type": "rpm", "path": ".konflux/operator"}, {"type": "gomod", "path": "."}]'
  - name: build-source-image
    value: "true"
  - name: skip-preflight
    value: true
  pipelineRef:
    name: build-pipeline        
  taskRunTemplate: {}
  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
status: {}
